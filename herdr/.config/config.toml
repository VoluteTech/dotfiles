onboarding = false

[theme]
name = "rose-pine-dawn"

auto_switch = false
[theme.custom]
panel_bg = "black"

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+s"

reload_config = "prefix+r"
help = "prefix+?"
detach = "prefix+d"

toggle_sidebar = "prefix+t"

copy_mode = "prefix+["

split_horizontal = ["alt+enter"]
split_vertical = ["alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+m"
last_pane = "prefix+;"

focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

rename_pane = "prefix+shift+o"

new_tab = "prefix+c"
rename_tab = "prefix+comma"
close_tab = "prefix+shift+x"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
accent = "blue"

pane_gaps = false
pane_outer_borders = false

pane_scrollbars = false

confirm_close = false

prompt_new_tab_name = false

mouse_capture = true

tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

window_title = "{hostname}: {workspace}"
